<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Delay Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center p-6">

    <div class="bg-white shadow-xl rounded-xl p-10 w-full max-w-2xl">

        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-6">
            ✈️ Flight Delay Prediction
        </h1>

        <form action="/predict" method="POST" class="space-y-5">

            <!-- Year -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Year</label>
                <input type="number" name="year" min="2010" max="2035" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            </div>

            <!-- Month -->
             <div>
                <label class="block text-gray-700 font-medium mb-1">Month</label>
                <select name="month" required
                        class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none">
                    <option value="">Select a month</option>
                    {% for m in range(1, 13) %}
                        <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Carrier Dropdown -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Carrier Name</label>
                <select name="carrier_name" required
                        class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none">
                    {% for c in carriers %}
                        <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Airport Dropdown -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Airport Name</label>
                <select name="airport_name" required
                        class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-indigo-400 focus:outline-none">
                    {% for a in airports %}
                        <option value="{{ a }}">{{ a }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium shadow-md transition-all">
                    Predict Delay
                </button>
            </div>
        </form>

        {% if prediction %}
        <div class="mt-8 p-5 rounded-lg 
                    {% if prediction == 'Delay Expected' %}
                        bg-red-100 border border-red-300 text-red-700
                    {% else %}
                        bg-green-100 border border-green-300 text-green-700
                    {% endif %}">
            <h2 class="text-xl font-semibold text-center">
                Result: {{ prediction }}
            </h2>
        </div>
        {% endif %}

    </div>

</body>
</html>
